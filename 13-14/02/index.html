<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Изменяем кириллицу на латиницу по клику</title>
    <style type="text/css"> 
        body { 
          background-image: url(passpotr_shablon.png); /* Путь к фоновому рисунку */
          background-position: left top; /* Положение фона */
          background-repeat: no-repeat; /* Отменяем повторение фона */ 
        }
       .block_1 {
        margin-left: 60px;
        margin-top: 60px;
      }
      .block_2 {
        margin-left: 80px;
        margin-top: 60px;
      }
      .fio {
        margin-left: 180px;
        margin-top: 180px;
      }

      .name {
        margin-left: 170px;
        margin-top: 30px;
      }
      .father {
        margin-left: 175px;
        margin-top: 8px;
      }
      .sex {
        margin-left: 165px;
        margin-top: 5px;
      }
      .birth {
        margin-left: 250px;
        margin-top: -20px;
      }
      .png {
        margin-left: 30px;
        margin-top: -50px;
      }
      .btn {
        margin-left: 10px;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div class="block_1">Выдан МВД России по Нижегородской области</div>
    <div class="block_2">20/05/2021 &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; 434-234</div>
    <div class="fio">Корякина</div>
    <div class="name">Дарья</div>
    <div class="father">Денисовна</div>
    <div class="sex">Ж</div>
    <div class="birth">02/11/2007</div>
    <div class="png">
      <img src="men.jpg" width="100px" height="100px"
    </div>
    <button class="btn" id="change"> Заменить </button>

  </body>

  <script src="change.js"></script>
</html>
