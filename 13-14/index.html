    <h1>Решение алгоритмической задачи</h1>
    <p>Формулировка задачи: 1013. Даны вещественные числа X и Y. Вычислить Z. Z = XY при X > Y, Z = ln(X + Y) в противном случае.</p>
    <form action="https://www.bing.com/search?" id="UserEnter" name="UserEnter" target="_blank">
        <ul>
            <li>Для поисковика:<input name="q" value="search"></li>
            <li>X: <input id="X" name="X"  type="number" step="any" value="10"></li>
            <li>Y: <input id="Y"  name="Y" type="number" step="any" value="20"></li>
            <li>Z: <input id="Z" name="Z" value="не определен"></li>
            <li><input id="verify" type="button" value="Вычислить"></li>
            <li><input id="send" type="button" value="Отправить"></li>
        </ul>
    </form>
